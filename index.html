<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイスケジュール</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📅 マイスケジュール</h1>
      <div id="user-info" class="user-info hidden">
        <img id="user-photo" src="" alt="アイコン" class="hidden">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn btn-outline">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ログイン前画面 -->
    <section id="login-section" class="card login-card">
      <h2>自分専用のスケジュール帳</h2>
      <p>Googleアカウントでログインすると、どこからでも自分の予定を確認・保存できます。</p>
      <button id="login-btn" class="btn btn-primary">Googleアカウントでログイン</button>
    </section>

    <!-- ログイン後メイン画面 -->
    <div id="app-section" class="hidden">
      <!-- 予定登録・編集フォーム -->
      <section class="card">
        <h2 id="form-title">✏️ 新しい予定を追加</h2>
        <form id="schedule-form">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label for="title">予定のタイトル *</label>
            <input type="text" id="title" placeholder="例：レポート提出、バイト、歯医者" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="date">日付 *</label>
              <input type="date" id="date" required>
            </div>
            <div class="form-group">
              <label for="time">時間（任意）</label>
              <input type="time" id="time">
            </div>
          </div>
          <div class="form-group">
            <label for="category">カテゴリ *</label>
            <select id="category" required>
              <option value="勉強・課題">📚 勉強・課題</option>
              <option value="仕事・バイト">💼 仕事・バイト</option>
              <option value="プライベート">🏠 プライベート</option>
              <option value="重要">⭐ 重要</option>
            </select>
          </div>
          <div class="form-group">
            <label for="memo">メモ・場所など</label>
            <textarea id="memo" rows="2" placeholder="例：持ち物、場所のメモなど"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">予定を保存する</button>
            <button type="button" id="cancel-edit-btn" class="btn btn-outline hidden">キャンセル</button>
          </div>
        </form>
      </section>

      <!-- 自分の予定一覧 -->
      <section class="card">
        <div class="list-header-row">
          <h2>📋 予定一覧（<span id="my-count">0</span>件）</h2>
          <div class="filter-tabs">
            <button type="button" class="filter-btn active" data-filter="all">すべて</button>
            <button type="button" class="filter-btn" data-filter="active">未完了</button>
            <button type="button" class="filter-btn" data-filter="completed">完了済み</button>
          </div>
        </div>
        <div id="my-schedules-list" class="schedule-list">
          <p class="empty-msg">読み込み中...</p>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
